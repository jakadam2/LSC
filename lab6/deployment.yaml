apiVersion: apps/v1
kind: Deployment
metadata:
  name: lscserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lscserver
  template:
    metadata:
      labels:
        app: lscserver
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: lscvolume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: lscvolume
          persistentVolumeClaim:
            claimName: lscpvc